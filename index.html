<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AetherFlow — Kinetic Particle Sandbox</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        /* Glassmorphism Dock */
        .glass-dock {
            background: rgba(16, 18, 28, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        /* Custom Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 5px;
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        /* Hide scrollbars in dock on small screens */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .animate-glow {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-slate-100 antialiased selection:bg-fuchsia-500/30">

    <!-- Full-screen Interactive Canvas -->
    <canvas id="sandboxCanvas"></canvas>

    <!-- Top Floating Header / Status Pill -->
    <header class="fixed top-4 left-4 right-4 z-20 flex items-center justify-between pointer-events-none">
        <div class="glass-dock px-4 py-2 rounded-full flex items-center gap-3 pointer-events-auto">
            <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_12px_#22d3ee] animate-glow"></div>
            <h1 class="font-display font-bold text-sm sm:text-base tracking-wide bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                AETHERFLOW
            </h1>
            <span class="hidden sm:inline-block text-xs text-slate-400 border-l border-white/10 pl-3" id="particleCounter">
                0 particles
            </span>
        </div>

        <div class="flex items-center gap-2 pointer-events-auto">
            <button id="toggleUiBtn" title="Toggle Dock Visibility" class="glass-dock p-2.5 rounded-full text-slate-300 hover:text-white hover:bg-white/10 transition active:scale-95">
                <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Subtle Hint Toast (Fades out on first interaction) -->
    <div id="hintToast" class="fixed top-20 left-1/2 -translate-x-1/2 z-10 pointer-events-none transition-opacity duration-700">
        <div class="glass-dock px-4 py-1.5 rounded-full text-xs text-slate-300 flex items-center gap-2 shadow-lg">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-fuchsia-400"></i>
            <span>Drag anywhere to pour kinetic sand &bull; Hold to warp space</span>
        </div>
    </div>

    <!-- Bottom Floating Glassmorphism Control Dock -->
    <aside id="controlDock" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 w-[95%] max-w-4xl transition-all duration-300 ease-out">
        <div class="glass-dock rounded-2xl sm:rounded-3xl p-3 sm:p-4 flex flex-col gap-3">
            
            <!-- Top Row: Tools, Physics Rules, and Actions -->
            <div class="flex flex-wrap items-center justify-between gap-2">
                
                <!-- Interaction Tools -->
                <div class="flex items-center bg-black/30 p-1 rounded-xl border border-white/5 overflow-x-auto no-scrollbar">
                    <button data-tool="pour" class="tool-btn active flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-white/15 text-white shadow-sm">
                        <i data-lucide="wand-2" class="w-3.5 h-3.5 text-cyan-400"></i>
                        <span>Pour</span>
                    </button>
                    <button data-tool="gravity" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">
                        <i data-lucide="orbit" class="w-3.5 h-3.5 text-purple-400"></i>
                        <span>Gravity Well</span>
                    </button>
                    <button data-tool="vortex" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">
                        <i data-lucide="tornado" class="w-3.5 h-3.5 text-pink-400"></i>
                        <span>Vortex</span>
                    </button>
                    <button data-tool="repel" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">
                        <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400"></i>
                        <span>Repulsor</span>
                    </button>
                </div>

                <!-- Physics Modes -->
                <div class="flex items-center bg-black/30 p-1 rounded-xl border border-white/5 overflow-x-auto no-scrollbar">
                    <button data-physics="sand" class="physics-btn active px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-white/15 text-white">
                        Sand
                    </button>
                    <button data-physics="zeroG" class="physics-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">
                        Zero-G
                    </button>
                    <button data-physics="bouncy" class="physics-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">
                        Bouncy
                    </button>
                    <button data-physics="swirl" class="physics-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">
                        Swirl
                    </button>
                </div>

                <!-- Explosive Burst & Clear Actions -->
                <div class="flex items-center gap-1.5 ml-auto sm:ml-0">
                    <button id="burstBtn" title="Trigger Supernova Burst" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-fuchsia-600/80 to-indigo-600/80 hover:from-fuchsia-500 hover:to-indigo-500 text-white border border-white/15 shadow-lg shadow-fuchsia-500/20 transition active:scale-95">
                        <i data-lucide="flame" class="w-3.5 h-3.5"></i>
                        <span>Burst</span>
                    </button>
                    <button id="clearBtn" title="Dissolve Canvas" class="p-2 rounded-xl bg-white/5 hover:bg-rose-500/20 text-slate-300 hover:text-rose-300 border border-white/10 transition active:scale-95">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Bottom Row: Palettes & Brush Size Slider -->
            <div class="flex flex-wrap items-center justify-between gap-4 pt-2 border-t border-white/10">
                
                <!-- Color Palettes -->
                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
                    <span class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mr-1">Palette</span>
                    
                    <button data-palette="cyberpunk" class="palette-btn active flex items-center gap-2 px-2.5 py-1 rounded-full text-xs font-medium bg-white/15 text-white border border-white/25 transition">
                        <span class="flex -space-x-1">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#00f5d4]"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-[#f15bb5]"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-[#fee440]"></span>
                        </span>
                        <span>Cyberpunk</span>
                    </button>

                    <button data-palette="sunset" class="palette-btn flex items-center gap-2 px-2.5 py-1 rounded-full text-xs font-medium bg-black/25 text-slate-400 hover:text-white border border-transparent transition">
                        <span class="flex -space-x-1">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#ff5e5b]"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-[#ff9a3c]"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-[#ffcf56]"></span>
                        </span>
                        <span>Sunset</span>
                    </button>

                    <button data-palette="aurora" class="palette-btn flex items-center gap-2 px-2.5 py-1 rounded-full text-xs font-medium bg-black/25 text-slate-400 hover:text-white border border-transparent transition">
                        <span class="flex -space-x-1">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#00ff87]"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-[#60efff]"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-[#b967ff]"></span>
                        </span>
                        <span>Aurora</span>
                    </button>

                    <button data-palette="candy" class="palette-btn flex items-center gap-2 px-2.5 py-1 rounded-full text-xs font-medium bg-black/25 text-slate-400 hover:text-white border border-transparent transition">
                        <span class="flex -space-x-1">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#ffafcc]"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-[#bde0fe]"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-[#cdb4db]"></span>
                        </span>
                        <span>Candy</span>
                    </button>
                </div>

                <!-- Brush Size & Trails -->
                <div class="flex items-center gap-4 ml-auto">
                    <div class="flex items-center gap-2">
                        <i data-lucide="circle-dot" class="w-3.5 h-3.5 text-slate-400"></i>
                        <label for="brushSlider" class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Size</label>
                        <input id="brushSlider" type="range" min="10" max="120" value="42" class="w-20 sm:w-28">
                    </div>

                    <button id="trailsToggle" title="Toggle Motion Trails" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium bg-white/15 text-cyan-300 border border-cyan-400/30 transition">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Trails</span>
                    </button>
                </div>

            </div>
        </div>
    </aside>

    <script>
        /**
         * AetherFlow — Kinetic Particle & Sand Sandbox
         * Self-contained HTML5 Canvas physics simulation with glowing additive blending,
         * spatial sand-stacking, gravitational wells, vortexes, and supernova shockwaves.
         */
        (function () {
            // Initialize Lucide icons
            if (window.lucide) {
                lucide.createIcons();
            }

            const canvas = document.getElementById('sandboxCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            const particleCounterEl = document.getElementById('particleCounter');
            const hintToast = document.getElementById('hintToast');

            // Configuration & Palettes
            const PALETTES = {
                cyberpunk: ['#00f5d4', '#00bbf9', '#f15bb5', '#9b5de5', '#fee440'],
                sunset:    ['#ff3b3f', '#ff6b35', '#ff9f1c', '#ffbf69', '#d90429'],
                aurora:    ['#00ff87', '#00e5ff', '#60efff', '#a855f7', '#38bdf8'],
                candy:     ['#ffafcc', '#ffc8dd', '#bde0fe', '#a2d2ff', '#cdb4db']
            };

            const MAX_PARTICLES = 4500;
            const CELL_SIZE = 5; // Grid resolution for kinetic sand piling

            // Simulation State
            let width = window.innerWidth;
            let height = window.innerHeight;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);

            let particles = [];
            let shockwaves = [];
            let gridCols = 0;
            let gridRows = 0;
            let sandGrid = null;

            // User Controls State
            let state = {
                tool: 'pour',          // 'pour' | 'gravity' | 'vortex' | 'repel'
                physics: 'sand',       // 'sand' | 'zeroG' | 'bouncy' | 'swirl'
                palette: 'cyberpunk',
                brushSize: 42,
                trails: true,
                uiVisible: true,
                hueShift: 0
            };

            // Pointer State
            const pointer = {
                isDown: false,
                x: width / 2,
                y: height / 2,
                prevX: width / 2,
                prevY: height / 2,
                vx: 0,
                vy: 0,
                hasInteracted: false
            };

            // Resize & Spatial Grid Setup
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);

                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                // Rebuild spatial occupancy grid for sand stacking
                gridCols = Math.ceil(width / CELL_SIZE);
                gridRows = Math.ceil(height / CELL_SIZE);
                sandGrid = new Uint8Array(gridCols * gridRows);

                // Clear background cleanly
                ctx.fillStyle = '#05050a';
                ctx.fillRect(0, 0, width, height);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Helper: Pick color from active palette
            function pickColor() {
                const colors = PALETTES[state.palette];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            // Particle Class
            class Particle {
                constructor(x, y, vx, vy, color, size) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.color = color;
                    this.size = size;
                    this.alpha = 0.85 + Math.random() * 0.15;
                    this.settled = false;
                    this.seed = Math.random() * Math.PI * 2;
                }
            }

            // Shockwave Ring Class (for Burst & Repulsor visual feedback)
            class Shockwave {
                constructor(x, y, color, maxRadius = 320) {
                    this.x = x;
                    this.y = y;
                    this.radius = 8;
                    this.maxRadius = maxRadius;
                    this.color = color;
                    this.alpha = 0.9;
                }
                update() {
                    this.radius += (this.maxRadius - this.radius) * 0.12 + 4;
                    this.alpha *= 0.92;
                    return this.alpha > 0.02;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = this.color;
                    ctx.globalAlpha = this.alpha;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Spawn particles around a point
            function spawnBrushParticles(x, y, vx, vy) {
                const count = Math.max(4, Math.floor(state.brushSize * 0.35));
                const radius = state.brushSize * 0.5;

                for (let i = 0; i < count; i++) {
                    if (particles.length >= MAX_PARTICLES) {
                        // Recycle oldest particle smoothly
                        particles.shift();
                    }
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.sqrt(Math.random()) * radius;
                    const px = x + Math.cos(angle) * dist;
                    const py = y + Math.sin(angle) * dist;

                    const spread = state.physics === 'zeroG' ? 1.8 : 1.1;
                    const pvx = vx * 0.25 + (Math.random() - 0.5) * spread;
                    const pvy = vy * 0.25 + (Math.random() - 0.5) * spread;
                    const size = 1.8 + Math.random() * 2.2;

                    particles.push(new Particle(px, py, pvx, pvy, pickColor(), size));
                }
            }

            // Trigger Supernova Burst
            function triggerBurst(cx = width / 2, cy = height / 2) {
                const colors = PALETTES[state.palette];
                shockwaves.push(new Shockwave(cx, cy, colors[0], Math.max(width, height) * 0.45));
                shockwaves.push(new Shockwave(cx, cy, colors[2 % colors.length], Math.max(width, height) * 0.3));

                // Blast existing particles outward
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    const dx = p.x - cx;
                    const dy = p.y - cy;
                    const dist = Math.hypot(dx, dy) + 1;
                    if (dist < 480) {
                        const force = (1 - dist / 480) * 24;
                        p.vx += (dx / dist) * force + (Math.random() - 0.5) * 4;
                        p.vy += (dy / dist) * force - 4;
                        p.settled = false;
                    }
                }

                // Spawn fresh starlight burst particles
                const burstCount = 260;
                for (let i = 0; i < burstCount; i++) {
                    if (particles.length >= MAX_PARTICLES) particles.shift();
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 3 + Math.random() * 14;
                    particles.push(new Particle(
                        cx + Math.cos(angle) * 6,
                        cy + Math.sin(angle) * 6,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        pickColor(),
                        2 + Math.random() * 2.5
                    ));
                }
            }

            // Seed initial decorative wave so canvas starts alive
            function seedInitialArt() {
                const cx = width / 2;
                const cy = height * 0.42;
                for (let i = 0; i < 420; i++) {
                    const t = (i / 420) * Math.PI * 4;
                    const r = 30 + (i / 420) * Math.min(width, height) * 0.24;
                    const x = cx + Math.cos(t) * r;
                    const y = cy + Math.sin(t) * r * 0.6;
                    particles.push(new Particle(
                        x, y,
                        -Math.sin(t) * 1.4,
                        Math.cos(t) * 1.4,
                        pickColor(),
                        2.2 + Math.random() * 1.6
                    ));
                }
            }

            // Update Physics Step
            function updatePhysics(time) {
                // Reset spatial grid if in sand mode
                if (state.physics === 'sand') {
                    sandGrid.fill(0);
                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        const gx = Math.floor(p.x / CELL_SIZE);
                        const gy = Math.floor(p.y / CELL_SIZE);
                        if (gx >= 0 && gx < gridCols && gy >= 0 && gy < gridRows) {
                            sandGrid[gy * gridCols + gx]++;
                        }
                    }
                }

                // Handle active pointer tool
                if (pointer.isDown) {
                    if (state.tool === 'pour') {
                        spawnBrushParticles(pointer.x, pointer.y, pointer.vx, pointer.vy);
                    } else if (state.tool === 'repel' && Math.random() < 0.25) {
                        shockwaves.push(new Shockwave(pointer.x, pointer.y, PALETTES[state.palette][1], state.brushSize * 2.4));
                    }
                }

                const wellRadius = Math.max(160, state.brushSize * 3.8);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];

                    // Apply Active Pointer Force Fields (Gravity Well, Vortex, Repulsor)
                    if (pointer.isDown && state.tool !== 'pour') {
                        const dx = pointer.x - p.x;
                        const dy = pointer.y - p.y;
                        const distSq = dx * dx + dy * dy;
                        const dist = Math.sqrt(distSq) + 0.1;

                        if (dist < wellRadius * 1.5) {
                            const falloff = Math.max(0, 1 - dist / (wellRadius * 1.5));

                            if (state.tool === 'gravity') {
                                // Pull inward + slight orbital curve
                                const pull = falloff * 1.35;
                                p.vx += (dx / dist) * pull - (dy / dist) * (pull * 0.25);
                                p.vy += (dy / dist) * pull + (dx / dist) * (pull * 0.25);
                                p.settled = false;
                            } else if (state.tool === 'vortex') {
                                // Strong tangential swirl + gentle inward suction
                                const swirl = falloff * 2.4;
                                const inward = falloff * 0.45;
                                p.vx += (-dy / dist) * swirl + (dx / dist) * inward;
                                p.vy += (dx / dist) * swirl + (dy / dist) * inward;
                                p.settled = false;
                            } else if (state.tool === 'repel') {
                                // Explosive push away
                                const push = falloff * 3.2;
                                p.vx -= (dx / dist) * push;
                                p.vy -= (dy / dist) * push;
                                p.settled = false;
                            }
                        }
                    }

                    // Physics Rules
                    if (state.physics === 'sand') {
                        p.vy += 0.24; // Gravity
                        p.vx *= 0.96;
                        p.vy *= 0.985;

                        // Kinetic sand grain piling & sliding
                        const gx = Math.floor(p.x / CELL_SIZE);
                        const gy = Math.floor((p.y + p.size + 1) / CELL_SIZE);
                        if (gx >= 0 && gx < gridCols && gy >= 0 && gy < gridRows) {
                            const belowCount = sandGrid[gy * gridCols + gx];
                            if (belowCount >= 3 && p.vy > 0) {
                                // Try sliding diagonally down-left or down-right
                                const dir = Math.random() < 0.5 ? -1 : 1;
                                const diagX = gx + dir;
                                if (diagX >= 0 && diagX < gridCols && sandGrid[gy * gridCols + diagX] < 2) {
                                    p.vx += dir * 0.9;
                                    p.vy *= 0.4;
                                } else {
                                    p.vy = 0;
                                    p.vx *= 0.5;
                                }
                            }
                        }
                    } else if (state.physics === 'zeroG') {
                        // Weightless cosmic drift
                        p.vx += Math.cos(time * 0.001 + p.seed) * 0.015;
                        p.vy += Math.sin(time * 0.001 + p.seed) * 0.015;
                        p.vx *= 0.992;
                        p.vy *= 0.992;
                    } else if (state.physics === 'bouncy') {
                        // Energetic elastic gravity
                        p.vy += 0.32;
                        p.vx *= 0.994;
                        p.vy *= 0.996;
                    } else if (state.physics === 'swirl') {
                        // Ambient harmonic flow field
                        const angle = Math.sin(p.x * 0.005 + time * 0.0012) + Math.cos(p.y * 0.005 + time * 0.001);
                        p.vx += Math.cos(angle) * 0.14;
                        p.vy += Math.sin(angle) * 0.14;
                        p.vx *= 0.96;
                        p.vy *= 0.96;
                    }

                    // Velocity cap for stability
                    const speed = Math.hypot(p.vx, p.vy);
                    if (speed > 22) {
                        p.vx = (p.vx / speed) * 22;
                        p.vy = (p.vy / speed) * 22;
                    }

                    // Integrate position
                    p.x += p.vx;
                    p.y += p.vy;

                    // Boundary Collisions
                    const bounce = state.physics === 'bouncy' ? 0.88 : (state.physics === 'zeroG' ? 0.95 : 0.25);

                    if (p.x < p.size) {
                        p.x = p.size;
                        p.vx = Math.abs(p.vx) * bounce;
                    } else if (p.x > width - p.size) {
                        p.x = width - p.size;
                        p.vx = -Math.abs(p.vx) * bounce;
                    }

                    if (p.y < p.size) {
                        p.y = p.size;
                        p.vy = Math.abs(p.vy) * bounce;
                    } else if (p.y > height - p.size) {
                        p.y = height - p.size;
                        p.vy = -Math.abs(p.vy) * bounce;
                        if (state.physics === 'sand') {
                            p.vx *= 0.82;
                        }
                    }
                }

                // Update shockwaves
                shockwaves = shockwaves.filter(sw => sw.update());

                // Decay pointer velocity
                pointer.vx *= 0.8;
                pointer.vy *= 0.8;
            }

            // Render Frame
            function render(time) {
                // Trail fade vs crisp clear
                ctx.globalCompositeOperation = 'source-over';
                if (state.trails) {
                    ctx.fillStyle = 'rgba(5, 5, 10, 0.22)';
                } else {
                    ctx.fillStyle = '#05050a';
                }
                ctx.fillRect(0, 0, width, height);

                // Additive Glow Blending for Neon & Pastel Luminance
                ctx.globalCompositeOperation = 'lighter';

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw Shockwaves
                for (let i = 0; i < shockwaves.length; i++) {
                    shockwaves[i].draw(ctx);
                }

                // Draw Interactive Cursor / Force-Field Reticle
                drawCursorReticle(time);
            }

            function drawCursorReticle(time) {
                const colors = PALETTES[state.palette];
                const primaryColor = colors[0];
                const radius = state.tool === 'pour' ? state.brushSize * 0.5 : Math.max(45, state.brushSize * 1.1);

                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.translate(pointer.x, pointer.y);

                if (state.tool === 'pour') {
                    ctx.beginPath();
                    ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = primaryColor;
                    ctx.globalAlpha = pointer.isDown ? 0.55 : 0.25;
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                } else {
                    // Animated gravitational / vortex field rings
                    const rings = pointer.isDown ? 3 : 2;
                    for (let r = 1; r <= rings; r++) {
                        const pulse = Math.sin(time * 0.006 + r) * 6;
                        ctx.beginPath();
                        ctx.arc(0, 0, (radius * r) / rings + pulse, 0, Math.PI * 2);
                        ctx.strokeStyle = colors[r % colors.length];
                        ctx.globalAlpha = pointer.isDown ? 0.45 : 0.2;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }

            // Main Animation Loop
            let lastHudUpdate = 0;
            function loop(time) {
                updatePhysics(time);
                render(time);

                if (time - lastHudUpdate > 200) {
                    particleCounterEl.textContent = `${particles.length.toLocaleString()} particles`;
                    lastHudUpdate = time;
                }
                requestAnimationFrame(loop);
            }

            // Pointer Event Handlers (Unified Mouse & Touch)
            function updatePointerCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                pointer.vx = x - pointer.x;
                pointer.vy = y - pointer.y;
                pointer.x = x;
                pointer.y = y;
            }

            function handlePointerDown(e) {
                if (e.target !== canvas) return;
                pointer.isDown = true;
                updatePointerCoords(e);
                pointer.vx = 0;
                pointer.vy = 0;

                if (!pointer.hasInteracted) {
                    pointer.hasInteracted = true;
                    hintToast.style.opacity = '0';
                }

                if (state.tool === 'pour') {
                    spawnBrushParticles(pointer.x, pointer.y, 0, 0);
                }
            }

            function handlePointerMove(e) {
                updatePointerCoords(e);
            }

            function handlePointerUp() {
                pointer.isDown = false;
            }

            canvas.addEventListener('mousedown', handlePointerDown);
            window.addEventListener('mousemove', handlePointerMove);
            window.addEventListener('mouseup', handlePointerUp);

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handlePointerDown(e);
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (pointer.isDown) e.preventDefault();
                handlePointerMove(e);
            }, { passive: false });

            window.addEventListener('touchend', handlePointerUp);

            // UI Controls Wiring
            const toolBtns = document.querySelectorAll('.tool-btn');
            toolBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    toolBtns.forEach(b => {
                        b.classList.remove('active', 'bg-white/15', 'text-white', 'shadow-sm');
                        b.classList.add('text-slate-400');
                    });
                    btn.classList.add('active', 'bg-white/15', 'text-white', 'shadow-sm');
                    btn.classList.remove('text-slate-400');
                    state.tool = btn.dataset.tool;
                });
            });

            const physicsBtns = document.querySelectorAll('.physics-btn');
            physicsBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    physicsBtns.forEach(b => {
                        b.classList.remove('active', 'bg-white/15', 'text-white');
                        b.classList.add('text-slate-400');
                    });
                    btn.classList.add('active', 'bg-white/15', 'text-white');
                    btn.classList.remove('text-slate-400');
                    state.physics = btn.dataset.physics;

                    // Wake up settled particles when switching physics
                    for (let i = 0; i < particles.length; i++) {
                        particles[i].settled = false;
                        if (state.physics === 'zeroG' || state.physics === 'swirl') {
                            particles[i].vy -= Math.random() * 2.5;
                        }
                    }
                });
            });

            const paletteBtns = document.querySelectorAll('.palette-btn');
            paletteBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    paletteBtns.forEach(b => {
                        b.classList.remove('active', 'bg-white/15', 'text-white', 'border-white/25');
                        b.classList.add('bg-black/25', 'text-slate-400', 'border-transparent');
                    });
                    btn.classList.add('active', 'bg-white/15', 'text-white', 'border-white/25');
                    btn.classList.remove('bg-black/25', 'text-slate-400', 'border-transparent');
                    state.palette = btn.dataset.palette;
                });
            });

            const brushSlider = document.getElementById('brushSlider');
            brushSlider.addEventListener('input', (e) => {
                state.brushSize = parseInt(e.target.value, 10);
            });

            const trailsToggle = document.getElementById('trailsToggle');
            trailsToggle.addEventListener('click', () => {
                state.trails = !state.trails;
                if (state.trails) {
                    trailsToggle.classList.add('bg-white/15', 'text-cyan-300', 'border-cyan-400/30');
                    trailsToggle.classList.remove('bg-black/25', 'text-slate-400', 'border-transparent');
                } else {
                    trailsToggle.classList.remove('bg-white/15', 'text-cyan-300', 'border-cyan-400/30');
                    trailsToggle.classList.add('bg-black/25', 'text-slate-400', 'border-transparent');
                }
            });

            document.getElementById('burstBtn').addEventListener('click', () => {
                triggerBurst(width / 2, height / 2);
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                particles = [];
                shockwaves = [];
                if (sandGrid) sandGrid.fill(0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = '#05050a';
                ctx.fillRect(0, 0, width, height);
            });

            // Toggle Dock Visibility for Pure Full-Screen Canvas Mode
            const toggleUiBtn = document.getElementById('toggleUiBtn');
            const controlDock = document.getElementById('controlDock');
            toggleUiBtn.addEventListener('click', () => {
                state.uiVisible = !state.uiVisible;
                if (state.uiVisible) {
                    controlDock.classList.remove('translate-y-36', 'opacity-0', 'pointer-events-none');
                    toggleUiBtn.innerHTML = '<i data-lucide="eye" class="w-4 h-4"></i>';
                } else {
                    controlDock.classList.add('translate-y-36', 'opacity-0', 'pointer-events-none');
                    toggleUiBtn.innerHTML = '<i data-lucide="eye-off" class="w-4 h-4"></i>';
                }
                if (window.lucide) lucide.createIcons();
            });

            // Start Sandbox on Window Load
            window.onload = function () {
                seedInitialArt();
                requestAnimationFrame(loop);
            };
        })();
    </script>
</body>
</html>
